name: Publish package to GitHub Packages

on:
  push:
    tags: [v*]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: npm publish to npm.pkg.github.com
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@tryfusion-co'

      - name: Install monorepo deps
        run: npm ci

      - name: Build package
        run: npm run build --workspace packages

      - name: Verify package version matches tag
        run: |
          PKG_VERSION="$(node -p "require('./packages/package.json').version")"
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: packages/package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --workspace packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
